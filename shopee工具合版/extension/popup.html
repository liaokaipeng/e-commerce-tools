<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; font-family: "Microsoft YaHei", sans-serif; padding: 12px; margin: 0; }
    h1 { font-size: 15px; margin: 0 0 10px; color: #ee4d2d; }
    p { font-size: 12px; color: #666; margin: 6px 0; line-height: 1.5; }
    .tip { background: #fff7ed; border: 1px solid #fdba74; color: #9a3412; border-radius: 6px; padding: 8px 10px; font-size: 12px; margin: 8px 0; }
    button {
      width: 100%; padding: 10px; font-size: 14px; color: #fff; background: #ee4d2d;
      border: none; border-radius: 4px; cursor: pointer;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    #status { margin-top: 10px; font-size: 12px; color: #333; word-break: break-all; }
    .ok { color: #2e7d32; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  <h1>Shopee 工具合版助手</h1>
  <p>本扩展同时负责「竞价导出」的登录 Cookie 与「视频上传」的接口凭证推送。</p>
  <div class="tip">视频上传凭证：打开 Shopee 短视频上传页手动上传一次视频，本扩展会自动抓取并推送到本地（无需手动操作）。</div>
  <p>竞价 Cookie：点击下方按钮，将当前浏览器中 Shopee 卖家中心的登录 Cookie 发送到本地工具（127.0.0.1:8765）。发送后到本地网页「竞价导出」Tab 选择店铺并导出 Excel。</p>
  <button id="send">发送登录信息到本地工具</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
