<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shopee 工具合版</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: #f4f6fb; color: #23262f; height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: #1a1a2e; color: #fff; padding: 12px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 34px; height: 34px; background: #ee4d2d; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .brand b { font-size: 16px; }
  nav { display: flex; gap: 8px; flex: 1; }
  nav button {
    border: none; background: rgba(255,255,255,.08); color: #cfd3e0;
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  nav button:hover { background: rgba(255,255,255,.16); }
  nav button.active { background: #ee4d2d; color: #fff; }
  nav button small { display: block; font-size: 11px; font-weight: 400; opacity: .75; }
  .frame-wrap { flex: 1; display: flex; }
  iframe { flex: 1; border: none; background: #fff; }
  @media (max-width: 640px) {
    .brand b { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">SP</div>
      <b>Shopee 工具合版</b>
    </div>
    <nav id="tabs">
      <button class="active" data-src="/tiktok/">TikTok 下载<small>批量无水印下载</small></button>
      <button data-src="/bidding/">竞价导出<small>Shopee 获胜数据 → Excel</small></button>
      <button data-src="/video/">视频上传<small>批量上传并关联商品</small></button>
    </nav>
  </div>
  <div class="frame-wrap">
    <iframe id="frame" src="/tiktok/"></iframe>
  </div>
  <script>
    const frame = document.getElementById('frame');
    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = btn.dataset.src;
    });
  </script>
</body>
</html>
