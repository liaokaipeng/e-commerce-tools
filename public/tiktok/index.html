<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok 无水印视频下载工具</title>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #fe2c55;
    --primary-dark: #d91c42;
    --border: #e2e5ea;
    --text: #23262f;
    --muted: #767b8a;
    --green: #25c16d;
    --red: #e5484d;
    --amber: #f5a623;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(135deg, #000000 0%, #1a1a2e 100%);
    color: #fff;
    padding: 28px 40px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .logo {
    width: 44px; height: 44px;
    background: var(--primary);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 14px rgba(254, 44, 85, 0.4);
  }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; opacity: 0.7; margin-top: 2px; }
  .container { max-width: 900px; margin: 28px auto; padding: 0 20px 60px; }
  .card {
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 2px 12px rgba(20, 20, 40, 0.06);
    padding: 24px 28px;
    margin-bottom: 20px;
  }
  .card h2 {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h2 .step {
    background: var(--primary);
    color: #fff;
    width: 22px; height: 22px;
    border-radius: 50%;
    font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  textarea {
    width: 100%;
    min-height: 140px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13.5px;
    font-family: Consolas, "Courier New", monospace;
    resize: vertical;
    line-height: 1.7;
    transition: border-color 0.2s;
  }
  textarea:focus { outline: none; border-color: var(--primary); }
  textarea::placeholder { color: #a8adba; font-family: "Microsoft YaHei", sans-serif; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { flex: 1; min-width: 260px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 13.5px;
    transition: border-color 0.2s;
  }
  .field input:focus { outline: none; border-color: var(--primary); }
  .btn {
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
  .btn-secondary {
    background: #f0f2f7; color: var(--text);
  }
  .btn-secondary:hover:not(:disabled) { background: #e2e6ef; }
  .actions { display: flex; gap: 10px; margin-top: 18px; }
  #proxyBar {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
    padding: 10px 16px;
    border-radius: 10px;
    margin-bottom: 20px;
    border: 1px solid var(--border);
    background: var(--card);
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
  .dot.off { background: var(--amber); }
  #vpnAlert {
    display: none;
    background: #fff7ed;
    border: 1px solid #fdba74;
    color: #9a3412;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13.5px;
    margin-bottom: 20px;
    align-items: flex-start;
    gap: 10px;
  }
  #vpnAlert.show { display: flex; }
  #log {
    max-height: 420px;
    overflow-y: auto;
    background: #10131c;
    border-radius: 10px;
    padding: 14px 16px;
    font-family: Consolas, "Courier New", monospace;
    font-size: 12.5px;
    line-height: 1.8;
  }
  .log-line { display: flex; gap: 8px; align-items: flex-start; word-break: break-all; }
  .log-line + .log-line { margin-top: 3px; }
  .log-time { color: #5c6370; flex-shrink: 0; }
  .log-info { color: #b8c0cc; }
  .log-warn { color: #ffc95c; }
  .log-ok { color: #5fd08a; }
  .log-err { color: #ff7b72; }
  .log-network { color: #ff9d5c; font-weight: 600; }
  .log-title { color: #7d8aff; font-weight: 600; }
  #summary { font-size: 13.5px; font-weight: 600; margin-top: 12px; display: none; }
  #progress { display: none; margin-top: 12px; font-size: 13px; font-weight: 600; }
  #progress .ok { color: var(--green); }
  #progress .err { color: var(--red); }
  .empty-hint { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 20px 0 30px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">TT</div>
  <div>
    <h1>TikTok 无水印视频批量下载工具</h1>
    <p>支持批量输入多个视频链接 · 以视频 ID 命名 · 自动跳过失效链接</p>
  </div>
</div>

<div class="container">
  <div id="proxyBar">
    <span class="dot" id="proxyDot"></span>
    <span id="proxyText">正在检测网络环境...</span>
  </div>

  <div id="vpnAlert">
    <span>⚠️</span>
    <span>
      <b>检测到网络连接问题，TikTok 无法访问。</b><br>
      中国大陆网络环境访问 TikTok 通常需要开启 VPN / 代理（如 Clash、v2ray 等）。
      请开启后点击「重新检测网络」，再重新下载。
    </span>
  </div>

  <div class="card">
    <h2><span class="step">1</span> 输入 TikTok 视频链接</h2>
    <textarea id="urls" placeholder="每行粘贴一个 TikTok 视频链接，例如：&#10;https://www.tiktok.com/@username/video/7439702365055290666&#10;https://www.tiktok.com/@username/video/7430096017845931294&#10;&#10;支持 www.tiktok.com / vm.tiktok.com / v.tiktok.com 短链接"></textarea>
    <div class="empty-hint" id="countHint"></div>
  </div>

  <div class="card">
    <h2><span class="step">2</span> 选择保存位置</h2>
    <div class="row">
      <div class="field">
        <label>保存目录（不存在将自动创建）</label>
        <input type="text" id="dir" placeholder="例如 D:\videos\tiktok">
      </div>
      <button class="btn btn-secondary" id="btnBrowse">浏览</button>
      <button class="btn btn-secondary" id="btnSetDefault">设为默认目录</button>
      <button class="btn btn-secondary" id="btnOpenDir">打开目录</button>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="btnDownload">开始下载</button>
      <button class="btn btn-secondary" id="btnCheckNet">重新检测网络</button>
    </div>
  </div>

  <div class="card">
    <h2><span class="step">3</span> 下载日志</h2>
    <div id="progress"></div>
    <div id="log"></div>
    <div id="summary"></div>
  </div>

  <div class="footer">提示：下载失败的网络错误通常需要开启 VPN 后重试；单个链接失效或受限会自动跳过，不影响其他视频。</div>
</div>

<script src="/common/dirpicker.js"></script>
<script>
const $ = (id) => document.getElementById(id);

// ---------- 状态 ----------
let downloading = false;
let proxyInfo = null;
let doneCount = 0, okCount = 0, failCount = 0, totalCount = 0;

function log(message, cls = 'info', title = '') {
  const el = document.createElement('div');
  el.className = 'log-line';
  const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
  el.innerHTML = `<span class="log-time">${time}</span><span class="log-${cls}">${title ? `[${title}] ` : ''}${message}</span>`;
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
}

function renderProgress() {
  const p = $('progress');
  p.innerHTML = `进度：${doneCount} / ${totalCount}　<span class="ok">成功 ${okCount}</span>　<span class="err">失败 ${failCount}</span>`;
}

// ---------- 代理状态 ----------
async function checkNetwork() {
  try {
    const r = await fetch('/api/tiktok/status');
    const data = await r.json();
    proxyInfo = data.proxy;
    if (data.defaultDir && !$('dir').value) $('dir').value = data.defaultDir;
    $('proxyDot').classList.remove('off');
    $('proxyText').textContent = proxyInfo
      ? `已检测到代理：${proxyInfo}（VPN/代理已开启，可直接下载）`
      : '未检测到系统代理，将尝试直连访问 TikTok（如失败请开启 VPN）';
    $('vpnAlert').classList.remove('show');
  } catch {
    $('proxyDot').classList.add('off');
    $('proxyText').textContent = '服务未连接，请确认已启动 main.js';
  }
}

// ---------- 目录 ----------
let hasDefault = false;

// 读取默认目录：首次未设置则留空（要求用户自选），设置过则回显
async function loadSettings() {
  try {
    const r = await fetch('/api/settings');
    const s = await r.json();
    const d = s.defaults && s.defaults.tiktok;
    if (d) { $('dir').value = d; hasDefault = true; }
  } catch {}
}

async function setDefaultDir(dir) {
  try {
    const r = await fetch('/api/settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tool: 'tiktok', dir }),
    });
    const d = await r.json();
    if (d.ok) { hasDefault = true; log('已设为默认目录：' + dir, 'ok'); return true; }
    log('设置默认目录失败：' + (d.message || '未知错误'), 'err');
    return false;
  } catch {
    log('设置默认目录失败：连接服务失败', 'err');
    return false;
  }
}

$('btnSetDefault').onclick = async () => {
  const dir = $('dir').value.trim();
  if (!dir) { alert('请先填写保存目录'); return; }
  await setDefaultDir(dir);
};

$('btnBrowse').onclick = () => {
  openDirPicker((dir) => { $('dir').value = dir; });
};

$('btnOpenDir').onclick = async () => {
  const dir = $('dir').value.trim();
  if (!dir) {
    alert('请先填写保存目录');
    return;
  }
  try {
    const r = await fetch('/api/open-dir', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dir }),
    });
    const data = await r.json();
    if (!data.ok) {
      alert('无法打开目录：' + data.message);
      log('无法打开目录：' + data.message, 'err');
    }
  } catch {
    alert('无法打开目录：连接服务失败');
  }
};

// ---------- 链接计数 ----------
$('urls').addEventListener('input', updateCount);
function updateCount() {
  const urls = $('urls').value.split(/\r?\n/).map(s => s.trim()).filter(s => /^https?:\/\/(www\.|vm\.|vt\.|v\.)?tiktok\.com\//i.test(s));
  $('countHint').textContent = urls.length ? `已识别 ${urls.length} 个有效链接` : '';
}

// ---------- 下载 ----------
async function startDownload() {
  if (downloading) return;
  const urls = $('urls').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
  if (urls.length === 0) {
    log('请先输入至少一个 TikTok 视频链接', 'err');
    return;
  }
  const dir = $('dir').value.trim();
  if (!dir) {
    log('请先选择保存目录', 'err');
    alert('请先选择保存目录');
    return;
  }
  // 首次设置目录后，询问是否设为默认目录（下次打开自动回显）
  if (!hasDefault) {
    if (confirm(`是否将「${dir}」设为默认目录？\n下次打开会自动使用该目录。`)) {
      await setDefaultDir(dir);
    }
  }
  downloading = true;
  $('btnDownload').disabled = true;
  $('btnDownload').textContent = '下载中...';
  $('vpnAlert').classList.remove('show');
  $('log').innerHTML = '';
  $('summary').style.display = 'none';

  log(`开始任务：共 ${urls.length} 个链接`, 'title', '任务');
  let networkIssue = false;
  doneCount = 0; okCount = 0; failCount = 0; totalCount = urls.length;
  const progress = $('progress');
  progress.style.display = 'block';
  renderProgress();

  try {
    const resp = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ urls: urls.join('\n'), dir }),
    });
    if (!resp.ok || !resp.body) {
      const err = await resp.json().catch(() => ({}));
      log(err.message || '请求失败', 'err');
      return;
    }
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        const line = part.split('\n').find(l => l.startsWith('data: '));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(6)); } catch { continue; }
        handleEvent(ev);
        if (ev.network) networkIssue = true;
      }
    }
  } catch (e) {
    log('连接服务失败：' + e.message, 'err');
  } finally {
    downloading = false;
    $('btnDownload').disabled = false;
    $('btnDownload').textContent = '开始下载';
  }

  if (networkIssue) $('vpnAlert').classList.add('show');
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'info':
      log(ev.message, 'info', '提示');
      break;
    case 'start':
      log(`(${ev.index}/${ev.total}) ${ev.url}`, 'title', '下载');
      break;
    case 'log':
      log(ev.message, 'warn');
      break;
    case 'done': {
      doneCount++;
      if (ev.ok) { okCount++; log(ev.message, 'ok', '成功'); }
      else { failCount++; log(ev.message, ev.network ? 'network' : 'err', '跳过'); }
      renderProgress();
      break;
    }
    case 'fatal':
      log(ev.message, 'err', '错误');
      break;
    case 'summary': {
      const s = $('summary');
      s.textContent = ev.message;
      s.style.display = 'block';
      s.style.color = ev.failed > 0 ? 'var(--red)' : 'var(--green)';
      break;
    }
  }
}

$('btnDownload').onclick = startDownload;
$('btnCheckNet').onclick = async () => {
  const b = $('btnCheckNet');
  b.disabled = true;
  const orig = b.textContent;
  b.textContent = '检测中…';
  await checkNetwork();
  b.disabled = false;
  b.textContent = orig;
  log('已重新检测网络环境', 'info');
};

checkNetwork();
loadSettings();
updateCount();
</script>
</body>
</html>
