<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>工具合集</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", -apple-system, "Segoe UI", sans-serif;
    background: #f4f6fb; color: #23262f; height: 100vh; display: flex; flex-direction: column;
  }
  .topbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: #1a1a2e; color: #fff; padding: 12px 24px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 34px; height: 34px; background: #ee4d2d; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 700;
  }
  .brand b { font-size: 16px; }
  nav { display: flex; gap: 18px; flex: 1; flex-wrap: wrap; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group .g-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1px;
    color: #8f95a8; margin-right: 2px; white-space: nowrap;
  }
  nav button {
    border: none; background: rgba(255,255,255,.08); color: #cfd3e0;
    padding: 9px 18px; border-radius: 8px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s; font-family: inherit;
  }
  nav button:hover { background: rgba(255,255,255,.16); }
  nav button.active { background: #ee4d2d; color: #fff; }
  nav button small { display: block; font-size: 11px; font-weight: 400; opacity: .75; }
  .frame-wrap { flex: 1; position: relative; }
  /*
    三个工具各用一个 iframe，首次访问时加载并常驻 DOM。
    切换 Tab 只改变 display，不重新加载页面，从而保留各 Tab 的状态
    （竞价已勾选的店铺、视频已填的凭证/日志等）。
  */
  iframe {
    position: absolute; inset: 0; width: 100%; height: 100%;
    border: none; background: #fff; visibility: hidden;
  }
  iframe.active { visibility: visible; }
  @media (max-width: 640px) {
    .brand b { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <div class="logo">SP</div>
      <b>工具合集</b>
    </div>
    <nav id="tabs">
      <div class="group">
        <span class="g-label">Shopee</span>
        <button class="active" data-src="/bidding/">竞价导出<small>获胜数据 → Excel</small></button>
        <button data-src="/video/">视频上传<small>批量上传并关联商品</small></button>
      </div>
      <div class="group">
        <span class="g-label">TikTok</span>
        <button data-src="/tiktok/">视频下载<small>批量无水印下载</small></button>
      </div>
    </nav>
  </div>
  <div class="frame-wrap">
    <iframe class="active" data-src="/bidding/"></iframe>
    <iframe data-src="/video/"></iframe>
    <iframe data-src="/tiktok/"></iframe>
  </div>
  <script>
    const tabs = document.querySelectorAll('#tabs button');
    const frames = document.querySelectorAll('iframe');
    const loaded = new Set();

    function showTab(btn) {
      tabs.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      const src = btn.dataset.src;
      frames.forEach((f) => f.classList.toggle('active', f.dataset.src === src));
      // 首次访问时再真正加载 iframe，避免一次性加载三个页面
      const target = Array.from(frames).find((f) => f.dataset.src === src);
      if (target && !loaded.has(src)) {
        target.src = src;
        loaded.add(src);
      }
    }

    document.getElementById('tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (btn) showTab(btn);
    });

    showTab(tabs[0]);
  </script>
</body>
</html>
